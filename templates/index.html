<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RE Tools</title>
    <style>
        /* Quantum Base — teal on deep navy (matches the light-tester UI). */
        :root { --bg:#0c1418; --panel:#14212b; --line:#243440; --fg:#e6f4f2;
                --muted:#8aa2a6; --accent:#17c3b2; --accent-deep:#0f9d8f;
                --accent-soft:rgba(23,195,178,.18); }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg);
               color:var(--fg); min-height:100vh; }

        header { border-bottom:1px solid var(--line); background:var(--bg); }
        .bar { max-width:960px; margin:0 auto; display:flex; align-items:center;
               gap:.75rem; padding:1rem; }
        .brand { font-weight:700; font-size:1.15rem; margin:0;
                 display:flex; align-items:center; gap:.6rem; letter-spacing:.01em; }
        .brand .mark { width:26px; height:26px; border-radius:7px; flex:none;
                 background:linear-gradient(135deg, var(--accent), var(--accent-deep));
                 box-shadow:0 0 0 1px rgba(23,195,178,.35), 0 2px 10px rgba(23,195,178,.25);
                 display:grid; place-items:center; color:#04121f; font-size:15px;
                 font-weight:800; }
        .brand .qb { color:var(--accent); }

        main { max-width:960px; margin:0 auto; padding:1.75rem 1rem 3rem; }
        .lead { color:var(--muted); margin:0 0 1.5rem; }

        .grid { display:grid; gap:1rem;
                grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); }
        .tile { display:flex; flex-direction:column; gap:.5rem; text-decoration:none;
                color:inherit; background:var(--panel); border:1px solid var(--line);
                border-radius:12px; padding:1.1rem 1.2rem; transition:border-color .15s,
                transform .15s, box-shadow .15s; }
        .tile.enabled:hover { border-color:var(--accent); transform:translateY(-2px);
                box-shadow:0 6px 20px rgba(0,0,0,.35), 0 0 0 1px var(--accent-soft); }
        .tile.disabled { opacity:.55; cursor:default; }
        .tile .icon { width:40px; height:40px; border-radius:9px; flex:none;
                display:grid; place-items:center; font-size:20px; color:var(--accent);
                background:var(--accent-soft); }
        .tile h2 { font-size:1.05rem; margin:.35rem 0 0; }
        .tile p { margin:0; color:var(--muted); font-size:.92rem; }
        .tile .go { margin-top:auto; padding-top:.6rem; font-size:.85rem;
                font-weight:600; color:var(--accent); }
        .tile.disabled .go { color:var(--muted); }

        footer { max-width:960px; margin:0 auto; padding:0 1rem 2rem;
                 color:var(--muted); font-size:.82rem; }

        /* Emergency stop — the only button that reaches BOTH light rigs. Each
           rig app's own stop covers only its own rig. */
        .spacer { flex:1; }
        .estop { flex:none; border:1px solid #7d2b26; border-radius:9px;
                 background:#2a1113; color:#ffb4ae; font-weight:700;
                 font-size:.85rem; letter-spacing:.02em; padding:.55rem .9rem;
                 cursor:pointer; transition:background .15s, border-color .15s; }
        .estop:hover:not(:disabled) { background:#3a1519; border-color:#b3413a; }
        .estop:disabled { opacity:.6; cursor:default; }
        .estopmsg { max-width:960px; margin:0 auto; padding:0 1rem;
                    font-size:.85rem; }
        .estopmsg:not(:empty) { padding-bottom:.85rem; }
        .estopmsg .ok { color:var(--accent); }
        .estopmsg .bad { color:#ffb4ae; }
    </style>
</head>
<body>
    <header>
        <div class="bar">
            <h1 class="brand"><span class="mark">QB</span>
                <span><span class="qb">RE</span> Tools</span></h1>
            <span class="spacer"></span>
            <button id="estop" class="estop" onclick="emergencyStopAll()"
                    title="Stop every run and turn BOTH light rigs off (ATR-L-BR and ATR-L-SPD). Each rig app's own stop only covers its own rig.">
                ⏻ STOP ALL LIGHTS</button>
        </div>
        <div id="estopMsg" class="estopmsg"></div>
    </header>

    <main>
        <h3 class="lead">Research Engineering Applications</h3>
        <div class="grid">
            {% for a in apps %}
            {% if a.enabled %}
            <a class="tile enabled" href="{{ a.href }}">
                <div class="icon">{{ a.icon }}</div>
                <h2>{{ a.name }}</h2>
                <p>{{ a.description }}</p>
                <div class="go">Open</div>
            </a>
            {% else %}
            <div class="tile disabled" href="/templates/maintenance.html">
                <div class="icon">{{ a.icon }}</div>
                <h2>{{ a.name }}</h2>
                <p>{{ a.description }}</p>
                <div class="go">Not yet available</div>
            </div>
            {% endif %}
            {% endfor %}
        </div>
    </main>

    <footer>Made by G :)</footer>

<script>
    // Panic button. The two light rigs are separate apps now, and each app's own
    // E-stop reaches only its own rig — this is the one that darkens both.
    // Fires immediately (no confirm): that's the point of an e-stop.
    const esc = (s) => String(s).replace(/[&<>"']/g,
        c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

    let estopBusy = false;
    async function emergencyStopAll() {
        if (estopBusy) return;
        estopBusy = true;
        const btn = document.getElementById('estop');
        const msg = document.getElementById('estopMsg');
        const label = btn.textContent;
        btn.disabled = true;
        btn.textContent = '⏻ Stopping…';
        msg.innerHTML = '<span>Stopping all runs and turning both light rigs off…</span>';
        try {
            const data = await (await fetch('/emergency-stop-all',
                { method: 'POST' })).json();
            const n = (data.stopped || []).length;
            let m = data.ok
                ? '<span class="ok">✔ Both rigs off' +
                  (n ? ' — stopped ' + n + ' active run' + (n === 1 ? '' : 's') : '') +
                  '.</span>'
                : '<span class="bad">⚠ Not every rig confirmed off.</span>';
            if (data.errors && data.errors.length)
                m += ' <span class="bad">' + esc(data.errors.join('; ')) + '</span>';
            msg.innerHTML = m;
        } catch (err) {
            msg.innerHTML = '<span class="bad">Emergency stop request failed: ' +
                esc(err) + ' — check both rigs manually.</span>';
        } finally {
            btn.disabled = false;
            btn.textContent = label;
            estopBusy = false;
            setTimeout(() => { msg.innerHTML = ''; }, 12000);
        }
    }
</script>
</body>
</html>
