# RD Tools front door — copy to /etc/nginx/sites-available/default on the master
# Pi (rdtools), then: sudo nginx -t && sudo systemctl reload nginx
#
# Routes the single host rdtools.q-id to multiple backends by sub-path:
#   /               -> dashboard    (gunicorn 127.0.0.1:8001)
#   /atr-l-br/      -> tag-tester@dmx (gunicorn 127.0.0.1:8003, prefix stripped)
#   /atr-l-spd/     -> tag-tester@hue (gunicorn 127.0.0.1:8004, prefix stripped)
#   /atr-l-ll/      -> 308 to /atr-l-spd/ (the rig's former name)
#   /etc-control/   -> chamber ctrl (gunicorn 127.0.0.1:8002, prefix stripped)
#
# The two light-testing apps are one codebase deployed twice, scoped to a rig by
# the RIG env var (see tag-tester/deploy/tag-tester@.service). They replaced the
# combined app that used to live at /light-testing/ on :8000.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 10M;          # allow large recipe uploads

    # --- ATR-L-BR (DMX / Godox rig) -------------------------------------------
    # Trailing slash on proxy_pass strips the /atr-l-br prefix, so the tag-tester
    # Flask app keeps serving its routes at root internally. The app's frontend
    # re-adds the prefix to every fetch/href via URL_PREFIX=/atr-l-br.
    location /atr-l-br/ {
        proxy_pass http://127.0.0.1:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Send bare /atr-l-br to the canonical trailing-slash form.
    location = /atr-l-br { return 301 /atr-l-br/; }

    # --- ATR-L-SPD (Hue rig) --------------------------------------------------
    # Same app, other rig; URL_PREFIX=/atr-l-spd. This must match the URL_PREFIX in
    # /etc/tag-tester/hue.env — the app's frontend prefixes every fetch/href with it,
    # so a mismatch breaks the app rather than degrading it. Change the two together.
    location /atr-l-spd/ {
        proxy_pass http://127.0.0.1:8004/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /atr-l-spd { return 301 /atr-l-spd/; }

    # Renamed: this rig was the ATR-L-LL ("Low Light") until its purpose widened from
    # low-light testing to producing defined spectra. Old bookmarks and old doc links
    # still work.
    #
    # A *regex* location, not a prefix one: `location /atr-l-ll/` sets no capture
    # variables, so the subpath would be dropped and every deep link would land on the
    # app's front page. 308 rather than 301 because a 301 downgrades POST to GET, which
    # would quietly break the /emergency-stop deep link (see tag-tester's
    # deploy/PUBLIC_ACCESS_CLOUDFLARE.md). Regex locations are matched in order and
    # before prefix locations, so this sits after the /atr-l-spd/ block it feeds.
    # `return 308` needs nginx >= 1.13; on anything older use 301 and accept that a
    # POST to an old URL arrives as a GET. Run `sudo nginx -t` before reloading.
    location ~ ^/atr-l-ll/(?<rest>.*)$ { return 308 /atr-l-spd/$rest; }
    location = /atr-l-ll               { return 308 /atr-l-spd/; }

    # --- Environmental Testing Chamber ----------------------------------------
    # Trailing slash strips the /etc-control prefix; the app re-adds it via
    # URL_PREFIX=/etc-control.
    location /etc-control/ {
        proxy_pass http://127.0.0.1:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /etc-control { return 301 /etc-control/; }

    # --- Materials Lab — metamerism + the SPD library -------------------------
    # Cross-rig by design: drives both ATR-L-BR and ATR-L-SPD, so it is one app
    # rather than one per rig. URL_PREFIX=/materials.
    location /materials/ {
        proxy_pass http://127.0.0.1:8005/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /materials { return 301 /materials/; }

    # --- Dashboard (root + everything else) -----------------------------------
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
