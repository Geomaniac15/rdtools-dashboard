# RD Tools front door — copy to /etc/nginx/sites-available/default on the master
# Pi (rdtools), then: sudo nginx -t && sudo systemctl reload nginx
#
# Routes the single host rdtools.q-id to multiple backends by sub-path:
#   /               -> dashboard    (gunicorn 127.0.0.1:8001)
#   /light-testing/ -> tag-tester   (gunicorn 127.0.0.1:8000, prefix stripped)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 10M;          # allow large recipe uploads

    # --- Light Testing --------------------------------------------------------
    # Trailing slash on proxy_pass strips the /light-testing prefix, so the
    # tag-tester Flask app keeps serving its routes at root internally. The app's
    # frontend re-adds the prefix to every fetch/href via URL_PREFIX=/light-testing.
    location /light-testing/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Send bare /light-testing to the canonical trailing-slash form.
    location = /light-testing { return 301 /light-testing/; }

    # --- Dashboard (root + everything else) -----------------------------------
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
